<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainbox OS</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;color:#f7f7fb;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
#island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:190px;height:52px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:rgba(9,10,15,.88);backdrop-filter:blur(28px) saturate(1.35);box-shadow:0 18px 70px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.07);overflow:hidden;transition:width .38s cubic-bezier(.22,1,.36,1),height .38s cubic-bezier(.22,1,.36,1),border-radius .35s}
.compact{height:52px;padding:0 15px;display:flex;align-items:center;gap:10px}
.orb{position:relative;width:23px;height:23px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0 8%,#9eeaff 15%,#65d9ff 29%,#8d63ff 59%,#20103f 100%);box-shadow:0 0 17px rgba(119,104,255,.6),inset 0 0 7px rgba(255,255,255,.5);animation:float 2.6s ease-in-out infinite}
.orb:after{content:"";position:absolute;inset:-5px;border:1px solid rgba(111,225,255,.12);border-radius:50%;animation:ring 2.8s ease-out infinite}
.label{font-size:13px;font-weight:700;letter-spacing:.01em}.mini{margin-left:auto;font-size:10px;color:#7f8491}.status{width:6px;height:6px;border-radius:50%;background:#5ee68a;box-shadow:0 0 10px #5ee68a}
.body{display:none;padding:14px 16px 16px}
.active{width:440px!important;height:254px!important;border-radius:24px!important}
.active .compact{display:none}.active .body{display:block}
.top{display:flex;align-items:center;gap:10px}.top .orb{width:30px;height:30px}
.headtext{min-width:0;display:flex;flex-direction:column}.state{font-size:12px;font-weight:750;letter-spacing:.01em}.sub{font-size:10px;color:#777d8b;margin-top:2px}
.close{margin-left:auto;width:27px;height:27px;border:1px solid rgba(255,255,255,.06);border-radius:50%;background:rgba(255,255,255,.04);color:#858b98;cursor:pointer}
.close:hover{background:rgba(255,255,255,.09);color:#fff}
.card{border:1px solid rgba(255,255,255,.065);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border-radius:15px;padding:10px 12px;margin-top:10px}
.who{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#747987;margin-bottom:5px}.text{font-size:12.5px;line-height:1.45;min-height:18px;white-space:pre-wrap}
.task{display:flex;align-items:center;gap:8px;margin-top:11px;color:#858b98;font-size:10.5px}.pulse{display:inline-flex;gap:3px}.pulse i{width:4px;height:4px;border-radius:50%;background:#a78bfa;animation:p 1s infinite}.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}
.footer{display:flex;align-items:center;gap:7px;margin-top:11px;color:#5f6470;font-size:9px}.chip{padding:4px 7px;border:1px solid rgba(255,255,255,.06);border-radius:8px;background:rgba(255,255,255,.025)}
#island.listening .orb{animation:listen .7s infinite}#island.thinking .orb{animation:think 1.1s linear infinite}#island.working .orb{animation:think .65s linear infinite}#island.speaking .orb{animation:speak .75s infinite}#island.error .orb{animation:none;filter:saturate(.55)}
@keyframes p{50%{opacity:.2;transform:scale(.65)}}@keyframes float{50%{transform:translateY(-2px) scale(1.03)}}@keyframes ring{70%{transform:scale(1.5);opacity:0}}@keyframes listen{50%{transform:scale(1.16);box-shadow:0 0 28px rgba(101,217,255,.75)}}@keyframes think{to{transform:rotate(360deg)}}@keyframes speak{50%{transform:scale(1.12);box-shadow:0 0 28px rgba(141,99,255,.75)}}
</style>
</head>
<body>
<div id="island">
<div class="compact"><div class="orb"></div><div class="label">Brainbox</div><div class="mini" id="mini">Ready</div><div class="status"></div></div>
<div class="body">
<div class="top"><div class="orb"></div><div class="headtext"><div class="state" id="state">Ready</div><div class="sub" id="sub">Say “Hey Brainbox”</div></div><button class="close" id="close">×</button></div>
<div class="card" id="youCard"><div class="who">You</div><div class="text" id="you"></div></div>
<div class="card" id="bbCard"><div class="who">Brainbox</div><div class="text" id="bb"></div></div>
<div class="task" id="task"><span class="pulse"><i></i><i></i><i></i></span><span id="taskText">Working…</span></div>
<div class="footer"><span class="chip" id="model">Local voice</span><span class="chip">Brainbox OS</span><span style="margin-left:auto">Online</span></div>
</div></div>
<script>
const island=document.getElementById('island'),stateEl=document.getElementById('state'),sub=document.getElementById('sub'),mini=document.getElementById('mini'),you=document.getElementById('you'),bb=document.getElementById('bb'),youCard=document.getElementById('youCard'),bbCard=document.getElementById('bbCard'),task=document.getElementById('task'),taskText=document.getElementById('taskText');
const labels={sleeping:['Sleeping','Say “Hey Brainbox”','Sleeping'],idle:['Ready','Say “Hey Brainbox”','Ready'],listening:['Listening','I’m listening','Listening'],thinking:['Thinking','Working it out','Thinking'],working:['Executing','Carrying out your request','Working'],speaking:['Speaking','Brainbox is talking','Speaking'],error:['Runtime error','Recovering…','Error']};
function setState(s){s=(s||'idle').toLowerCase();island.className=s;const l=labels[s]||labels.idle;stateEl.textContent=l[0];sub.textContent=l[1];mini.textContent=l[2];task.style.display='none';if(s==='sleeping'||s==='idle'){youCard.style.display='none';bbCard.style.display='none';return}island.classList.add('active');if(s==='listening'){youCard.style.display='block';bbCard.style.display='none';you.textContent='';}else if(s==='speaking'){youCard.style.display='block';bbCard.style.display='block';}else{youCard.style.display=you.textContent?'block':'none';bbCard.style.display=bb.textContent?'block':'none';task.style.display='flex';taskText.textContent=s==='error'?'Runtime error':s==='working'?'Executing…':'Thinking…'}}
function typeText(el,text){el.textContent='';let i=0;const step=()=>{el.textContent=text.slice(0,i++);if(i<=text.length)requestAnimationFrame(step)};step()}
window.brainbox.onEvent(e=>{if(e.event==='state')setState(e.state);if(e.event==='transcript'){youCard.style.display='block';typeText(you,e.text||'')}if(e.event==='ack'||e.event==='response'){bbCard.style.display='block';typeText(bb,e.text||'')}if(e.event==='tool.started'){island.className='working active';task.style.display='flex';taskText.textContent='Running '+(e.tool||'tool')+'…'}if(e.event==='tool.executed'){task.style.display='flex';taskText.textContent='Task complete'}if(e.event==='tts.ready')document.getElementById('model').textContent=e.provider||'Local voice';if(e.event==='error'){setState('error');task.style.display='flex';taskText.textContent=e.error||'Brainbox encountered an error'}});document.getElementById('close').onclick=()=>window.brainbox.minimize();setState('sleeping');
</script>
</body></html>
