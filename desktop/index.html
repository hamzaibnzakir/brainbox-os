<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Brainbox Dynamic Island</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#f4f4f6;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#island{position:absolute;top:0;left:50%;transform:translateX(-50%);width:170px;min-height:48px;border:1px solid rgba(255,255,255,.1);border-radius:25px;background:rgba(13,15,21,.92);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 18px 60px rgba(0,0,0,.5);overflow:hidden;transition:width .34s cubic-bezier(.22,1,.36,1),min-height .34s cubic-bezier(.22,1,.36,1),border-radius .3s}.compact{height:48px;padding:0 14px;display:flex;align-items:center;gap:9px}.dot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#67e8f9 20%,#8b5cf6 55%,#24104f 100%);box-shadow:0 0 18px #8b5cf655;animation:float 2.4s ease-in-out infinite}.label{font-size:13px;font-weight:700}.status{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 9px #4ade80}.body{display:none;padding:12px 14px 14px}.active{width:420px!important;min-height:190px!important;border-radius:22px!important}.active .body{display:block}.active .compact{display:none}.head{display:flex;align-items:center;gap:9px;margin-bottom:10px}.head .dot{width:26px;height:26px}.headtext{display:flex;flex-direction:column}.state{font-size:12px;font-weight:700}.sub{font-size:10px;color:#777d8a;margin-top:2px}.close{margin-left:auto;border:0;background:transparent;color:#777d8a;font-size:17px;cursor:pointer}.card{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);border-radius:13px;padding:9px 11px;margin-top:8px}.who{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#747986;margin-bottom:4px}.text{font-size:12.5px;line-height:1.45;min-height:18px;white-space:pre-wrap}.task{font-size:11px;color:#a2a6b0;margin-top:9px}.pulse{display:inline-flex;gap:3px;margin-right:7px}.pulse i{width:4px;height:4px;border-radius:50%;background:#a78bfa;animation:p 1s infinite}.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.25;transform:scale(.7)}}@keyframes float{50%{transform:translateY(-2px) scale(1.03)}}#island.listening .dot{animation:pulse .65s infinite}#island.thinking .dot{animation:spin 1s linear infinite}#island.working .dot{animation:spin .65s linear infinite}#island.speaking .dot{animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 24px #67e8f9aa}}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div id="island"><div class="compact"><div class="dot"></div><div class="label">Brainbox</div><div class="status"></div></div><div class="body"><div class="head"><div class="dot"></div><div class="headtext"><div class="state" id="state">Sleeping</div><div class="sub" id="sub">Say “Hey Brainbox”</div></div><button class="close" id="close">×</button></div><div class="card" id="youCard"><div class="who">🎙 You</div><div class="text" id="you"></div></div><div class="card" id="bbCard"><div class="who">🔊 Brainbox</div><div class="text" id="bb"></div></div><div class="task" id="task"><span class="pulse"><i></i><i></i><i></i></span><span id="taskText">Working…</span></div></div></div><script>const island=document.getElementById('island'),stateEl=document.getElementById('state'),sub=document.getElementById('sub'),you=document.getElementById('you'),bb=document.getElementById('bb'),youCard=document.getElementById('youCard'),bbCard=document.getElementById('bbCard'),task=document.getElementById('task'),taskText=document.getElementById('taskText');const labels={sleeping:['Sleeping','Say “Hey Brainbox”'],idle:['Ready','Say “Hey Brainbox”'],listening:['Listening','I’m listening'],thinking:['Thinking','Working it out'],working:['Working','Executing your request'],speaking:['Speaking','Brainbox is talking'],error:['Error','Recovering…']};function setState(s){s=(s||'idle').toLowerCase();island.className=s;if(['listening','thinking','working','speaking','error'].includes(s))island.classList.add('active');const l=labels[s]||labels.idle;stateEl.textContent=l[0];sub.textContent=l[1];if(s==='sleeping'||s==='idle')task.style.display='none';if(s==='listening'){youCard.style.display='block';bbCard.style.display='none';task.style.display='none';you.textContent='';}if(s==='thinking'){task.style.display='block';taskText.textContent='Thinking…';}if(s==='working'){task.style.display='block';taskText.textContent='Working…';}if(s==='speaking'){task.style.display='none';bbCard.style.display='block';}if(s==='error'){task.style.display='block';taskText.textContent='Runtime error';}}function typeText(el,text){el.textContent='';let i=0;function step(){el.textContent=text.slice(0,i++);if(i<=text.length)requestAnimationFrame(step)}step()}window.brainbox.onEvent(e=>{if(e.event==='state')setState(e.state);if(e.event==='transcript'){youCard.style.display='block';typeText(you,e.text||'')}if(e.event==='ack'||e.event==='response'){bbCard.style.display='block';typeText(bb,e.text||'')}if(e.event==='tool.started'){task.style.display='block';taskText.textContent='Running '+(e.tool||'tool')+'…'}if(e.event==='tool.executed'){task.style.display='block';taskText.textContent='Task complete'}if(e.event==='error'){setState('error');taskText.textContent=e.error||'Brainbox encountered an error'}});document.getElementById('close').onclick=()=>window.brainbox.minimize();setState('sleeping');</script></body></html>
