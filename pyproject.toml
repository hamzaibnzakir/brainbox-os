[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainbox-os"
version = "0.1.0"
description = "Local-first personal AI operating system"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
needle = ["cactus-needle>=3.0,<4"]
voice = ["sounddevice>=0.5", "soundfile>=0.12", "pyttsx3>=2.90", "openwakeword>=0.6", "numpy>=1.26", "faster-whisper>=1.2,<2"]

[project.scripts]
brainbox = "brainbox_os.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
